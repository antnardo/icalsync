name: Release

# Pas de PyPI, par choix : la distribution est jointe à la release GitHub. Le
# jour où PyPI s'impose, remplacer l'étape d'envoi par
# pypa/gh-action-pypi-publish avec la publication de confiance (id-token: write).

on:
  release:
    types: [published]

permissions:
  contents: write  # joindre les fichiers à la release

jobs:
  build:
    name: Construire et joindre à la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Vérifier que la version du tag correspond au paquet
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/icalsync/__init__.py').read_text()).group(1))")
          echo "tag=$tag paquet=$pkg"
          test "$tag" = "$pkg"
      - run: uv build
      - name: Vérifier les métadonnées
        run: uvx twine check dist/*
      - name: Joindre la distribution à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --group dev
      - name: ruff format
        run: uv run ruff format --check src tests examples
      - name: ruff check
        run: uv run ruff check src tests examples
      - name: mypy
        run: uv run mypy

  test:
    name: Tests ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
          python-version: ${{ matrix.python }}
      # Sous macOS, l'extra « mac » apporte pyobjc : les conversions EventKit se
      # testent sans autorisation, seul le magasin de Calendar en demande une.
      - if: runner.os == 'macOS'
        run: uv sync --group dev --extra mac
      - if: runner.os != 'macOS'
        run: uv sync --group dev
      - name: Tests
        run: uv run pytest -q

  build:
    name: Construire la distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv build
      - name: Vérifier les métadonnées
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
